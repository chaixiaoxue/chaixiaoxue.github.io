<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>彩虹小岛 · Rainbow Island — 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #bfe8ff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { position: relative; width: 100%; height: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; background: #bfe8ff; }
  #gl { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 160px); display: block; touch-action: none; }
  /* ---------- 顶栏 ---------- */
  #topbar { position: absolute; top: 0; left: 0; right: 0; height: 58px; background: rgba(255,248,236,.96);
    border-bottom: 2px solid #ffe1a8; display: flex; align-items: center; padding: 0 8px; gap: 6px; z-index: 10; }
  #stars { font-size: 19px; color: #e5e7eb; letter-spacing: 1px; white-space: nowrap; }
  #stars .on { color: #f59e0b; }
  #wordchip { flex: 1; text-align: center; font-size: 19px; font-weight: 800; color: #8b5cf6; background: #f3e8ff;
    border-radius: 999px; padding: 6px 4px; white-space: nowrap; overflow: hidden; }
  .tbtn { width: 42px; height: 42px; border: 2px solid #ffd166; border-radius: 12px; background: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .tbtn:active { transform: scale(.92); }
  /* ---------- 对话区 ---------- */
  #dialogue { position: absolute; left: 0; right: 0; bottom: 64px; background: rgba(255,253,246,.97);
    border-top: 2px solid #ffe1a8; padding: 8px 10px 8px 78px; min-height: 96px; z-index: 10; }
  #avatar { position: absolute; left: 10px; top: 10px; width: 58px; height: 58px; border-radius: 50%;
    border: 3px solid #ffd166; object-fit: cover; background: #ffe4f1; }
  #dlg-name { font-size: 13px; font-weight: 800; color: #b45309; }
  #dlg-text { font-size: 20px; font-weight: 800; color: #3a2e2a; line-height: 1.35; margin-top: 2px; }
  #dlg-text .key { color: #7c3aed; }
  #dlg-hint { font-size: 12px; color: #a16207; margin-top: 2px; }
  /* ---------- 控制行 ---------- */
  #controls { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: rgba(255,253,246,.97);
    border-top: 1px solid #ffe9c4; display: flex; align-items: center; padding: 0 10px; gap: 8px; z-index: 10; }
  .cbtn { width: 48px; height: 48px; border: 2px solid #ffd166; border-radius: 14px; background: #fff7e0; font-size: 24px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .cbtn:active { transform: scale(.92); }
  #status { font-size: 15px; font-weight: 700; color: #92400e; flex: 1; }
  /* ---------- 找一找选择卡 ---------- */
  #choices { position: absolute; left: 0; right: 0; bottom: 168px; display: none; justify-content: center; gap: 8px; z-index: 11; padding: 0 6px; }
  #choices.show { display: flex; }
  .choice { width: 31%; max-width: 160px; background: #fff; border: 3px solid #e5d9f7; border-radius: 16px; overflow: hidden;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .choice img { width: 100%; height: 128px; object-fit: cover; display: block; background: #8fce6e; }
  .choice .clabel { font-size: 16px; font-weight: 700; color: #3a2e2a; text-align: center; padding: 6px 2px; line-height: 1.25; }
  .choice.good { border-color: #22c55e; background: #f0fdf4; }
  .choice.bad { border-color: #f59e0b; background: #fffbeb; }
  .choice.pulse { border-color: #ffb703; animation: pulse .5s ease-in-out 4; }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  /* ---------- 中央提示条 ---------- */
  #toast { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.9); z-index: 25;
    background: #7c3aed; color: #fff; font-size: 26px; font-weight: 800; padding: 14px 26px; border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #sound-note { display: none; margin-top: 12px; padding: 10px; background: #f0fdf4; color: #15803d;
    border: 2px solid #86efac; border-radius: 12px; font-size: 16px; font-weight: 800; }
  /* ---------- 遮罩 ---------- */
  .overlay { position: absolute; inset: 0; z-index: 20; background: rgba(30,20,10,.55); display: none;
    align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .card { background: #fffdf6; border-radius: 24px; padding: 22px 18px; width: 100%; max-width: 420px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.3); max-height: 92%; overflow-y: auto; }
  .card h1 { font-size: 26px; color: #3a2e2a; margin-bottom: 6px; }
  .card h2 { font-size: 22px; color: #8b5cf6; margin: 4px 0; }
  .card p { font-size: 15px; color: #6b4f2a; line-height: 1.6; }
  .bigbtn { display: block; width: 100%; margin-top: 16px; padding: 15px; font-size: 20px; font-weight: 800;
    color: #fff; background: #f97316; border: none; border-radius: 16px; cursor: pointer; }
  .bigbtn:active { transform: scale(.97); }
  .bigbtn.alt { background: #fff; color: #3a2e2a; border: 2px solid #ffd166; font-size: 17px; }
  .wordgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .wordcell { border: 3px solid #e5d9f7; border-radius: 14px; background: #fff; padding: 12px 4px; cursor: pointer; }
  .wordcell.sel { border-color: #f59e0b; background: #fffbeb; }
  .wordcell .en { display: inline-block; font-size: 16px; font-weight: 800; color: #fff; border-radius: 8px; padding: 2px 8px; }
  .wordcell .zh { font-size: 14px; color: #6b4f2a; margin-top: 6px; }
  #unlock-img { width: 150px; height: 150px; object-fit: contain; }
  #finish-stars { font-size: 32px; color: #f59e0b; letter-spacing: 4px; margin: 6px 0; }
  #loading { position: absolute; inset: 0; z-index: 30; background: #bfe8ff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; font-size: 18px; color: #7c3aed; font-weight: 700; }
  #loading .bar { width: 220px; height: 14px; background: #fff; border-radius: 999px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0%; background: #f59e0b; transition: width .2s; }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="topbar">
    <div id="stars"></div>
    <div id="wordchip">behind · 后面</div>
    <div class="tbtn" id="mode-btn" title="白天/黄昏/夜晚">☀</div>
    <div class="tbtn" id="back-btn" title="按住3秒回选词">↩</div>
  </div>

  <div id="dialogue">
    <img id="avatar" src="assets/princess.png" alt="公主">
    <div id="dlg-name">彩虹公主</div>
    <div id="dlg-text">你好呀！</div>
    <div id="dlg-hint"></div>
  </div>

  <div id="controls">
    <div class="cbtn" id="speak-btn" title="再听一遍">♪</div>
    <div class="cbtn" id="hint-btn" title="提示">?</div>
    <div id="status">先逛逛小岛吧</div>
  </div>

  <div id="choices"></div>
  <div id="toast"></div>

  <div class="overlay show" id="ov-unlock">
    <div class="card">
      <img id="unlock-img" src="assets/princess.png" alt="彩虹公主">
      <h1>彩虹小岛 · 3D</h1>
      <p>手机要先点一下，<br>小马的声音才能出来哦</p>
      <button class="bigbtn" id="unlock-btn">点我开声音 ♪</button>
    </div>
  </div>

  <div class="overlay" id="ov-setup">
    <div class="card">
      <h1>家长设置</h1>
      <p>今晚练哪个词？可以多选，按顺序来。<br>孩子玩的时候不用认字，听和点就可以。</p>
      <div id="sound-note">🔊 声音已开</div>
      <div class="wordgrid" id="wordgrid"></div>
      <button class="bigbtn" id="start-btn">开始玩 ▶</button>
    </div>
  </div>

  <div class="overlay" id="ov-finish">
    <div class="card">
      <h1>今天玩得真棒！</h1>
      <div id="finish-stars">★★★★</div>
      <div id="finish-summary" style="font-size:16px;color:#6b4f2a"></div>
      <p id="finish-mission" style="margin-top:10px"></p>
      <button class="bigbtn" id="again-btn">再玩一次 ▶</button>
      <button class="bigbtn alt" id="change-btn">换个词</button>
    </div>
  </div>

  <div id="loading"><div>彩虹小岛加载中…</div><div class="bar"><i id="loadbar"></i></div><div id="loadmsg" style="font-size:13px;color:#6b4f2a"></div></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
