<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>彩虹小岛 · Rainbow Island</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #8ec9ee; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #game { width: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center; }
  #game canvas { display: block; }
  #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    text-align: center; color: #3a2e2a; background: #dff3ff; padding: 24px; font-size: 17px; line-height: 1.6; }
</style>
</head>
<body>
<div id="game"></div>
<div id="fallback"><div>小岛正在加载…<br>如果一直打不开，请检查网络后刷新页面。</div></div>
<!-- Phaser 3.80.1（固定版本）：优先用本地同目录的 phaser.min.js（离线也能玩），
     本地文件万一缺失再回退到 CDN；game.js 只在 Phaser 就绪后加载。
     纯静态页面：index.html + game.js + phaser.min.js + assets/，无构建步骤。 -->
<script src="phaser.min.js"></script>
<script>
  function startGame() {
    var s = document.createElement('script');
    s.src = 'game.js';
    document.body.appendChild(s);
  }
  function showFallback() { document.getElementById('fallback').style.display = 'flex'; }
  if (typeof Phaser !== 'undefined') {
    startGame();
  } else {
    var c = document.createElement('script');
    c.src = 'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js';
    c.onload = function () {
      if (typeof Phaser !== 'undefined') startGame(); else showFallback();
    };
    c.onerror = showFallback;
    document.head.appendChild(c);
  }
</script>
</body>
</html>
