<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>彩虹小岛 · Rainbow Island</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#bfe8ff;color:#3a2e2a}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:#dff3ff;position:relative;overflow:hidden}
/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff8ec;border-bottom:2px solid #ffe1a8;z-index:30}
#stars{font-size:20px;letter-spacing:2px;min-width:96px;color:#f59e0b}
#stars .off{opacity:.25;filter:grayscale(1)}
#wordChip{flex:1;text-align:center;font-weight:800;font-size:20px;color:#7c3aed;background:#f3e8ff;border-radius:999px;padding:4px 10px}
.round-btn{width:44px;height:44px;border-radius:50%;border:2px solid #ffd166;background:#fff;font-size:22px;cursor:pointer;position:relative;overflow:hidden;flex:none}
.round-btn .fill{position:absolute;left:0;bottom:0;width:100%;height:0%;background:rgba(255,180,0,.45)}
/* ---------- island ---------- */
#island{position:relative;flex:1;overflow:hidden;cursor:pointer;transition:background 1.2s}
#island{background:#7ec8f7}
#world{position:absolute;left:0;top:0;width:4800px;height:3200px;background:url("assets/media-generation-rainbow-island-background-0-e90fe822-2835-4aa4-825b-9f67320fce96.webp") center center/4800px 3200px no-repeat #8fce6e;will-change:transform}
#tintOverlay{position:absolute;inset:0;z-index:2;pointer-events:none;transition:background 1.2s}
.tint-day{background:rgba(0,0,0,0)}
.tint-sunset{background:linear-gradient(rgba(255,140,60,.38),rgba(255,190,110,.30))}
.tint-night{background:linear-gradient(rgba(8,14,52,.62),rgba(8,14,52,.72))}

#celestial{display:none}
#starsLayer{position:absolute;inset:0;pointer-events:none;z-index:3;display:none}
#island.mode-night #starsLayer{display:block}
.tw{position:absolute;color:#fff;font-size:12px;animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
#fliesLayer{position:absolute;inset:0;pointer-events:none;z-index:3;display:none}
#island.mode-night #fliesLayer{display:block}
.fly{position:absolute;width:8px;height:8px;border-radius:50%;background:#d9f99d;box-shadow:0 0 10px 3px #bef264;animation:flymove 7s ease-in-out infinite alternate}
@keyframes flymove{from{transform:translate(0,0)}to{transform:translate(26px,-34px)}}
#pathsLayer{position:absolute;inset:0;pointer-events:none;z-index:2}
#zonesLayer{position:absolute;inset:0;z-index:1;pointer-events:none}
.zone-wash{position:absolute;pointer-events:none}
.zone-label{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.88);border:2px solid rgba(255,209,102,.9);color:#5b4636;font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;pointer-events:none;white-space:nowrap}
#minimap{position:absolute;right:8px;top:8px;width:92px;height:62px;background:rgba(255,255,255,.88);border:2px solid #ffd166;border-radius:10px;z-index:26;pointer-events:none;overflow:hidden}
.mm-zone{position:absolute}
.mm-dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.4)}
.mm-dot.me{width:10px;height:10px;margin:-5px 0 0 -5px;background:#ec4899}
.path{position:absolute;background:rgba(255,244,200,.75);border-radius:999px}
#decoLayer{position:absolute;inset:0;z-index:4}
.deco{position:absolute;transform:translate(-50%,-100%);cursor:pointer;line-height:1}
.deco img{display:block;object-fit:contain}
.deco.bloom{animation:bloom .5s ease}
@keyframes bloom{0%{transform:translate(-50%,-100%) scale(.6)}60%{transform:translate(-50%,-100%) scale(1.35)}100%{transform:translate(-50%,-100%) scale(1)}}
.deco.wiggle{animation:wig .5s ease}
@keyframes wig{0%,100%{transform:translate(-50%,-100%) rotate(0)}25%{transform:translate(-50%,-100%) rotate(-14deg)}75%{transform:translate(-50%,-100%) rotate(14deg)}}
#spotsLayer{position:absolute;inset:0;z-index:5}
.spot{position:absolute;transform:translate(-50%,-100%);cursor:pointer;text-align:center;line-height:1}
.spot img{display:block;object-fit:contain}
.spot .nm{font-size:11px;background:rgba(255,255,255,.85);border-radius:999px;padding:1px 6px;color:#5b4636}
.spot.glow{animation:glow 1s ease infinite}
.spot.wiggle{animation:wig .5s ease}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #ffd166)}50%{filter:drop-shadow(0 0 14px #ffb703) drop-shadow(0 0 6px #fff)}}
/* characters: outer positioned by left/top (feet), inner flips, bob animates */
.char{position:absolute;width:76px;height:84px;margin-left:-38px;margin-top:-80px;z-index:8;cursor:pointer;touch-action:none}
.char .flip{width:100%;height:100%}
.char.face-left .flip{transform:scaleX(-1)}
.char .bob{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.char.walking .bob{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.char.hopping .bob{animation:hop .45s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.char .shadow{position:absolute;left:50%;bottom:-4px;width:52px;height:10px;margin-left:-26px;background:rgba(0,0,0,.18);border-radius:50%}
.char .visual{width:64px;height:76px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.char .visual img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.char.behind .visual{clip-path:inset(0 0 45% 0)}
.char.inbox .visual{clip-path:inset(0 0 46% 0)}
.char.celebrate .bob{animation:jump .45s ease 2}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(0) rotate(6deg)}}
.char.wrong .bob{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#princess{z-index:12}
#princess .visual{width:70px;height:92px}
#princess.waving .bob{animation:wave .5s ease 2}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
#princess.lean .bob{animation:lean 1s ease}
@keyframes lean{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(4px) rotate(4deg) scale(1.05)}}
#princess.pointing .bob{animation:point 1s ease}
@keyframes point{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.minibubble{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:#fff;border:3px solid #ffd166;border-radius:16px;padding:2px 10px;font-size:26px;z-index:20;white-space:nowrap;animation:pop .3s ease}
.minibubble:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;border:7px solid transparent;border-top-color:#ffd166;border-bottom:0}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
/* drop circles */
.circle{position:absolute;width:56px;height:56px;margin-left:-28px;margin-top:-28px;border:3px dashed rgba(255,255,255,.95);border-radius:50%;z-index:7;cursor:pointer;background:rgba(255,255,255,.18);animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.circle.right{border-color:#22c55e;background:rgba(34,197,94,.25)}
.circle.wrongpick{border-color:#f59e0b;background:rgba(245,158,11,.25)}
/* ---------- dialogue panel ---------- */
#dialogue{display:flex;gap:10px;align-items:flex-start;background:#fffdf6;border-top:2px solid #ffe1a8;padding:10px;min-height:118px;z-index:30}
#dlgAvatar{width:64px;height:64px;flex:none;border-radius:50%;background:#ffe4f1;display:flex;align-items:center;justify-content:center;border:3px solid #ffb6d5;overflow:hidden}
#dlgAvatar img{width:100%;height:100%;object-fit:contain;display:block}
#dlgAvatar.talking{animation:talk .4s ease infinite alternate}
@keyframes talk{from{transform:scale(1)}to{transform:scale(1.07)}}
#dlgBody{flex:1;min-width:0}
#dlgName{font-size:13px;font-weight:800;color:#b45309}
#dlgText{font-size:19px;font-weight:700;line-height:1.35;min-height:52px}
#dlgText .key{color:#7c3aed;background:#f3e8ff;border-radius:8px;padding:0 6px}
#dlgHint{font-size:12px;color:#a16207}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f59e0b;margin-right:3px;animation:dotb 1s ease infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dotb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* ---------- control row ---------- */
#control{background:#fffdf6;padding:6px 10px 10px;border-top:1px solid #ffe9c4;z-index:30}
.hint-row{display:flex;gap:10px;align-items:center}
.big-btn{width:52px;height:52px;border-radius:16px;border:2px solid #ffd166;background:#fff7e0;font-size:26px;cursor:pointer;flex:none}
#statusText{flex:1;font-size:14px;color:#92400e;font-weight:700}
#choices{display:flex;gap:8px;margin-top:8px}
#choices.hidden{display:none}
.choice{flex:1;background:#fff;border:3px solid #e5d9f7;border-radius:16px;padding:6px 2px;cursor:pointer;text-align:center}
.choice .mini{height:86px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(#bfe6ff,#dff3d8)}
.choice.right{border-color:#22c55e;background:#f0fdf4}
.choice.wrongpick{border-color:#f59e0b;background:#fffbeb}
.choice .mini .mchar{position:absolute;transform:translate(-50%,-90%)}
.choice .mini .mchar img{height:52px;display:block}
.choice .mini .mobj{position:absolute;transform:translate(-50%,-100%)}
.choice .mini .mobj img{height:56px;display:block}
/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;background:rgba(30,20,10,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.overlay.hidden{display:none}
.card{background:#fffdf6;border-radius:24px;padding:22px 18px;max-width:420px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.card h1{font-size:26px;margin:6px 0}
.card p{font-size:16px;line-height:1.5;color:#6b4f2a}
.cta{display:block;width:100%;margin-top:14px;padding:14px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(90deg,#f97316,#f43f5e);border:0;border-radius:16px;cursor:pointer}
.ghost{display:block;width:100%;margin-top:10px;padding:10px;font-size:16px;background:#fff;border:2px solid #e5d9f7;border-radius:16px;cursor:pointer}
#unlockBtn{font-size:24px;font-weight:800;color:#fff;background:linear-gradient(90deg,#f59e0b,#ef4444);border:0;border-radius:999px;padding:18px 30px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.deco-row{font-size:40px;margin-bottom:10px}
.tiny{margin-top:10px;font-size:13px;color:#fff}
.word-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.wc{border:3px solid #e5d9f7;border-radius:14px;padding:8px 2px;cursor:pointer;background:#fff}
.wc.sel{border-color:#f59e0b;background:#fffbeb}
.wc .wc-en{font-size:17px;font-weight:800;color:#fff;border-radius:8px;padding:2px 0}
.wc .wc-zh{font-size:13px;color:#6b4f2a;margin-top:2px}
#flyStar{position:fixed;font-size:34px;z-index:99;pointer-events:none;display:none;color:#f59e0b}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="stars" aria-label="stars"></div>
    <div id="wordChip">behind</div>
    <button class="round-btn" id="sunBtn" title="day / sunset / night">☀</button>
    <button class="round-btn" id="backBtn" title="hold 3 seconds to go back"><span>↩</span><div class="fill"></div></button>
  </div>

  <div id="island" class="mode-day">
    <div id="world">
      <div id="zonesLayer"></div>
      <div id="pathsLayer"></div>
      <div id="decoLayer"></div>
      <div id="spotsLayer"></div>
      <div id="animalsLayer"></div>
      <div id="princess" class="char">
        <div class="shadow"></div>
        <div class="flip"><div class="bob"><div class="visual" id="princessVisual"></div></div></div>
      </div>
    </div>
    <div id="celestial">☀</div>
    <div id="starsLayer"></div>
    <div id="fliesLayer"></div>
    <div id="cloudsLayer"></div>
    <div id="tintOverlay" class="tint-day"></div>
    <div id="minimap"></div>
  </div>

  <div id="dialogue">
    <div id="dlgAvatar"><img src="assets/princess.png" alt="彩虹公主"></div>
    <div id="dlgBody">
      <div id="dlgName">彩虹公主</div>
      <div id="dlgText">点一点小岛，彩虹公主就会走过去哦！</div>
      <div id="dlgHint"></div>
    </div>
  </div>

  <div id="control">
    <div class="hint-row">
      <button class="big-btn" id="replayBtn" title="hear again">♪</button>
      <button class="big-btn" id="hintBtn" title="hint">?</button>
      <div id="statusText">先逛逛小岛吧</div>
    </div>
    <div id="choices" class="hidden"></div>
  </div>
</div>

<div id="flyStar">★</div>

<div class="overlay" id="ov-unlock">
  <div class="card" style="background:transparent;box-shadow:none">
    <div class="deco-row"><img src="assets/princess.png" alt="彩虹公主" style="height:120px"></div>
    <button id="unlockBtn">点我开声音 ♪</button>
    <div class="tiny">彩虹小岛 · Rainbow Island</div>
  </div>
</div>

<div class="overlay hidden" id="ov-setup">
  <div class="card">
    <h1>家长设置</h1>
    <p>今晚练哪个词？可以多选，按顺序来。孩子玩的时候不用认字，听和点就可以。</p>
    <div class="word-grid" id="wordGrid"></div>
    <button class="cta" id="setupStartBtn">开始玩 ▶</button>
  </div>
</div>

<div class="overlay hidden" id="ov-intro">
  <div class="card">
    <div class="deco-row"><img src="assets/media-generation-rainbow-island-background-0-e90fe822-2835-4aa4-825b-9f67320fce96.webp" alt="彩虹小岛" style="width:100%;border-radius:16px"></div>
    <h1>彩虹小岛</h1>
    <p>彩虹小岛很大，有森林、池塘、沙滩、花园和小山，小动物们住在岛上不同的地方。点一点小岛，公主就会走过去；点一点小动物，就能跟它说话！</p>
    <button class="cta" id="startBtn">▶ 开始逛小岛</button>
  </div>
</div>

<div class="overlay hidden" id="ov-finish">
  <div class="card">
    <h1>今天玩得真棒！</h1>
    <div id="finishStars" style="font-size:30px;color:#f59e0b">★★★★</div>
    <div id="finishSummary"></div>
    <div id="missionBox" style="margin-top:10px;font-size:15px;line-height:1.5;color:#6b4f2a"></div>
    <button class="cta" id="againBtn">再玩一次 ▶</button>
    <button class="ghost" id="changeWordBtn">换个词</button>
  </div>
</div>

function hasClip(key){ return !!(window.AUDIO_DATA && window.AUDIO_DATA[key]); }
function playClip(key){
  return new Promise(function(res){
    var done = false;
    function fin(){ if (!done){ done = true; res(); } }
    try{
      var src = (window.AUDIO_DATA && window.AUDIO_DATA[key]) || "";
      if (!src){ fin(); return; }
      var a = new Audio(src);
      a.onended = fin; a.onerror = fin;
      var p = a.play();
      if (p && p.catch){ p.catch(fin); }
      setTimeout(fin, 6000);
    }catch(e){ fin(); }
  });
}
function speak(text){
  return new Promise(function(res){
    var done = false;
    function fin(){ if (!done){ done = true; res(); } }
    try{
      if (!("speechSynthesis" in window)){ fin(); return; }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.75; u.pitch = 1.1;
      u.onend = fin; u.onerror = fin;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
      setTimeout(fin, 5000);
    }catch(e){ fin(); }
  });
}

function cameraTarget(){
  var vw = islandEl ? islandEl.clientWidth : 400;
  var vh = islandEl ? islandEl.clientHeight : 560;
  var px = POS.princess.x / 100 * WORLD_W;
  var py = POS.princess.y / 100 * WORLD_H;
  return {
    x: clamp(px - vw / 2, 0, Math.max(0, WORLD_W - vw)),
    y: clamp(py - vh / 2, 0, Math.max(0, WORLD_H - vh))
  };
}
function snapCamera(){
  var t = cameraTarget();
  camX = t.x; camY = t.y;
  applyCamera();
}
function applyCamera(){
  if (!worldEl) return;
  worldEl.style.transform = "translate(" + (-Math.round(camX * 10) / 10) + "px," + (-Math.round(camY * 10) / 10) + "px)";
}
function updateCamera(dt){
  if (!worldEl || !islandEl) return;
  var t = cameraTarget();
  var k = Math.min(1, dt * 4.5);
  camX += (t.x - camX) * k;
  camY += (t.y - camY) * k;
  if (Math.abs(t.x - camX) < 0.5) camX = t.x;
  if (Math.abs(t.y - camY) < 0.5) camY = t.y;
  applyCamera();
  updateMinimap();
}

/* ================= 移动引擎：rAF 驱动，公主走路、动物漫步共用 ================= */
var movers = {};   /* id -> {el, tx, ty, speed, resolve, kind} */
var lastTick = 0;
function posOf(id){ var p = POS[id]; return { x: p.x, y: p.y }; }
function applyPos(id){
  var el = $(id === "princess" ? "princess" : "char-" + id);
  if (!el) return;
  el.style.left = POS[id].x + "%";
  el.style.top = POS[id].y + "%";
}
/* 走到目标点（百分比坐标）。speed 单位 %/秒。返回 Promise，走到 resolves(true)，被打断 resolves(false)。 */
function walkTo(id, tx, ty, speed){
  return new Promise(function(resolve){
    var el = $(id === "princess" ? "princess" : "char-" + id);
    if (!el){ resolve(false); return; }
    if (movers[id]){ movers[id].resolve(false); }
    var cur = posOf(id);
    var dx = tx - cur.x, dy = ty - cur.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 0.6){ resolve(true); return; }
    el.classList.add("walking");
    el.classList.toggle("face-left", dx < -0.5);
    movers[id] = { el: el, tx: tx, ty: ty, speed: speed || 14, resolve: resolve, id: id };
  });
}
function stopWalking(id){
  if (movers[id]){ var m = movers[id]; delete movers[id]; m.el.classList.remove("walking"); m.resolve(false); }
}
function tick(ts){
  requestAnimationFrame(tick);
  if (!lastTick) lastTick = ts;
  var dt = Math.min(0.1, (ts - lastTick) / 1000);
  lastTick = ts;
  updateCamera(dt);
  var ids = Object.keys(movers);
  for (var i = 0; i < ids.length; i++){
    var m = movers[ids[i]];
    var p = POS[m.id];
    var dx = m.tx - p.x, dy = m.ty - p.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var step = m.speed * dt;
    if (dist <= step){
      p.x = m.tx; p.y = m.ty;
      delete movers[m.id];
      m.el.classList.remove("walking");
      applyPos(m.id);
      m.resolve(true);
    } else {
      p.x += dx / dist * step;
      p.y += dy / dist * step;
      applyPos(m.id);
    }
  }
}
function walkPrincessTo(x, y, speed){ return walkTo("princess", clamp(x, 3, 97), clamp(y, 4, 96), speed || 18); }

  var z = WANDER_ZONES[id] || { x0: 10, x1: 90, y0: 10, y1: 90 };
  return { x: z.x0 + Math.random() * (z.x1 - z.x0), y: z.y0 + Math.random() * (z.y1 - z.y0) };
}
function startWander(id){
  if (wanderTimers[id]) return;
  function loop(){
    if (!wanderOn){ wanderTimers[id] = setTimeout(loop, 1200); return; }
    if (phase === "dialogue" || phase === "answering" || phase === "celebrating"){ wanderTimers[id] = setTimeout(loop, 1500); return; }
    if (curRound && curRound.animal === id){ wanderTimers[id] = setTimeout(loop, 1500); return; }
    var pt = wanderPoint(id);
    var el = $("char-" + id);
    if (el){ el.classList.remove("behind", "inbox"); }
    walkTo(id, pt.x, pt.y, 5 + Math.random() * 2).then(function(){
      wanderTimers[id] = setTimeout(loop, 1800 + Math.random() * 3200);
    });
  }
  wanderTimers[id] = setTimeout(loop, 800 + Math.random() * 2000);
}
function stopWander(id){
  if (wanderTimers[id]){ clearTimeout(wanderTimers[id]); delete wanderTimers[id]; }
  stopWalking(id);
}

/* ================= 位置摆放：遮挡画法让位置零歧义 ================= */
function wordOffset(wordId){
  /* 相对地点基准点的偏移（世界像素）与层级、裁剪：语义位置，画面必须一眼看懂 */
  switch (wordId){
    case "in":     return { dx: 0,   dy: -11, z: 9,  cls: "inbox" };
    case "on":     return { dx: 0,   dy: -73, z: 11, cls: "" };
    case "under":  return { dx: 0,   dy: 22,  z: 6,  cls: "" };
    case "nextto": return { dx: 47,  dy: 11,  z: 11, cls: "" };
    case "behind": return { dx: -47, dy: -17, z: 4,  cls: "behind" };
    case "front":  return { dx: 0,   dy: 28,  z: 13, cls: "" };
    default:       return { dx: 0,   dy: 0,   z: 11, cls: "" };
  }
}
/* 小图卡里的偏移（百分比，相对于小图卡本身） */
function miniOffset(wordId){
  switch (wordId){
    case "in":     return { dx: 0,   dy: -2,  z: 9,  cls: "inbox" };
    case "on":     return { dx: 0,   dy: -13, z: 11, cls: "" };
    case "under":  return { dx: 0,   dy: 4,   z: 6,  cls: "" };
    case "nextto": return { dx: 12,  dy: 2,   z: 11, cls: "" };
    case "behind": return { dx: -12, dy: -3,  z: 4,  cls: "behind" };
    case "front":  return { dx: 0,   dy: 5,   z: 13, cls: "" };
    default:       return { dx: 0,   dy: 0,   z: 11, cls: "" };
  }
}
/* 放一放的落点圈位置：只求三个圈互相分得开、好点，与语义位置分开算 */
function circleOffset(wordId){
  /* 落点圈偏移（世界像素） */
  switch (wordId){
    case "in":     return { dx: 0,   dy: -11 };
    case "on":     return { dx: 0,   dy: -78 };
    case "under":  return { dx: -47, dy: 34 };
    case "nextto": return { dx: 51,  dy: 0 };
    case "behind": return { dx: -51, dy: -22 };
    case "front":  return { dx: 0,   dy: 45 };
    default:       return { dx: 0,   dy: 0 };
  }
}
function placeAnimalAtSpot(animalId, spot, wordId){
  var off = wordOffset(wordId);
  var el = $("char-" + animalId);
  stopWalking(animalId);
  POS[animalId].x = clamp(spot.x + off.dx / WORLD_W * 100, 3, 97);
  POS[animalId].y = clamp(spot.y + off.dy / WORLD_H * 100, 4, 96);
  if (el){
    el.classList.remove("behind", "inbox");
    if (off.cls) el.classList.add(off.cls);
    el.style.zIndex = off.z;
    el.classList.remove("face-left");
  }
  applyPos(animalId);
}
function clearPlacement(animalId){
  var el = $("char-" + animalId);
  if (el){ el.classList.remove("behind", "inbox"); el.style.zIndex = 8; }
}
function homeAnimal(animalId){

/* 回合开始时，把其他小动物请离本回合的地点 700px 以外，画面里永远不挤 */
function spreadAnimalsAwayFrom(spot){
  CHAR_IDS.forEach(function(id){
    if (curRound && curRound.animal === id) return;
    var p = POS[id];
    var dx = (p.x - spot.x) / 100 * WORLD_W, dy = (p.y - spot.y) / 100 * WORLD_H;
    if (Math.hypot(dx, dy) < 600){
      var best = null, bestD = -1;
      for (var t = 0; t < 12; t++){
        var pt = wanderPoint(id);
        var ddx = (pt.x - spot.x) / 100 * WORLD_W, ddy = (pt.y - spot.y) / 100 * WORLD_H;
        var d = Math.hypot(ddx, ddy);
        if (d > bestD){ bestD = d; best = pt; }
        if (d > 650) break;
      }
      if (best) walkTo(id, best.x, best.y, 12);
    }
  });
}

/* ================= 回合：对话驱动找一找 / 放一放 ================= */
function buildRounds(wordId){
  var spots = ROUND_SPOTS[wordId] || ROUND_SPOTS.behind;
  var animals = shuffle(CHAR_IDS).slice(0, 4);
  var rs = [];
  for (var i = 0; i < 4; i++){
    rs.push({ word: wordId, animal: animals[i], spot: spots[i % spots.length], type: (i % 2 === 0) ? "find" : "place", idx: i });
  }
  return rs;
}
function sentenceHtml(wordId, animalId, spotId){
  var w = WORDS[wordId], ch = CHARS[animalId], sp = SPOTS[spotId];
  return "The " + ch.en + " is <span class='key'>" + w.en + "</span> the " + sp.en + ".";
}

async function askFindChoice(r){

function renderMiniScene(mini, animalId, spotId, wordId){

async function runPlaceRound(r, myToken){

  ]);

async function askPlace(r){
  return new Promise(function(resolve){
    var spot = SPOTS[r.spot];
    var others = WORD_ORDER.filter(function(id){ return id !== r.word; });
    var opts = shuffle([r.word].concat(pick(others, 2)));
    var layer = worldEl;
    var circles = [];
    opts.forEach(function(wid){
      var off = circleOffset(wid);
      var c = document.createElement("div");
      c.className = "circle";
      c.dataset.word = wid;
      c.style.left = clamp(spot.x + off.dx / WORLD_W * 100, 4, 96) + "%";
      c.style.top = clamp(spot.y + off.dy / WORLD_H * 100, 6, 94) + "%";
      c.addEventListener("click", function(e){
        e.stopPropagation();
        if (phase !== "answering") return;
        var animalEl = $("char-" + r.animal);
        var cx = parseFloat(c.style.left), cy = parseFloat(c.style.top);
        walkTo(r.animal, cx, cy, 12).then(function(){
          if (wid === r.word){
            c.classList.add("right");
            placeAnimalAtSpot(r.animal, spot, r.word);
            cleanup();
            resolve(true);
          } else {
            wrongCount++;
            c.classList.add("wrongpick");
            if (animalEl){ animalEl.classList.add("wrong"); setTimeout(function(){ animalEl.classList.remove("wrong"); }, 450); }
            princessPoint();
            setDialogue("princess", "彩虹公主", "不是这里哦，再试一次！");
            setStatus("不是这里哦，再试一次");
            setTimeout(function(){ c.classList.remove("wrongpick"); }, 900);
          }
        });
      });
      layer.appendChild(c);
      circles.push(c);
    });
    /* 拖动物到圈里 */
    enableAnimalDrag(r, circles, resolve, cleanup);
    function cleanup(){
      circles.forEach(function(c){ if (c.parentNode) c.parentNode.removeChild(c); });
      disableAnimalDrag();
    }
    r._cleanupCircles = cleanup;
  });
}
var dragState = null;
function enableAnimalDrag(r, circles, resolve, cleanup){
  var el = $("char-" + r.animal);
  if (!el) return;
  disableAnimalDrag();
  dragState = { animal: r.animal, circles: circles, resolve: resolve, cleanup: cleanup, round: r, dragging: false };
  el.addEventListener("pointerdown", onDragStart);
}
function disableAnimalDrag(){
  if (!dragState) return;
  var el = $("char-" + dragState.animal);
  if (el){ el.removeEventListener("pointerdown", onDragStart); }
  dragState = null;
}
function onDragStart(e){
  if (!dragState || phase !== "answering") return;
  e.preventDefault();
  e.stopPropagation();
  var id = dragState.animal;
  stopWalking(id);
  dragState.dragging = true;
  dragState.moved = false;
  var move = function(ev){
    if (!dragState || !dragState.dragging) return;
    var rect = islandEl.getBoundingClientRect();
    var x = clamp((ev.clientX - rect.left + camX) / WORLD_W * 100, 3, 97);
    var y = clamp((ev.clientY - rect.top + camY) / WORLD_H * 100, 4, 96);
    POS[id].x = x; POS[id].y = y;
    applyPos(id);
    dragState.moved = true;
  };
  var up = function(ev){
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    if (!dragState) return;
    dragState.dragging = false;
    if (!dragState.moved) return;
    /* 落点最近的圈 */
    var best = null, bestD = 1e9;
    dragState.circles.forEach(function(c){
      var cx = parseFloat(c.style.left), cy = parseFloat(c.style.top);
      var d = Math.hypot((POS[id].x - cx) / 100 * WORLD_W, (POS[id].y - cy) / 100 * WORLD_H);
      if (d < bestD){ bestD = d; best = c; }
    });
    if (best && bestD < 75){
      var wid = best.dataset.word;
      var r = dragState.round;
      if (wid === r.word){
        best.classList.add("right");
        placeAnimalAtSpot(r.animal, SPOTS[r.spot], r.word);
        var cl = dragState.cleanup, rs = dragState.resolve;
        dragState = null;
        cl(); rs(true);
      } else {
        wrongCount++;
        best.classList.add("wrongpick");
        var el2 = $("char-" + r.animal);
        if (el2){ el2.classList.add("wrong"); setTimeout(function(){ el2.classList.remove("wrong"); }, 450); }
        princessPoint();
        setDialogue("princess", "彩虹公主", "不是这里哦，再试一次！");
        setStatus("不是这里哦，再试一次");
        setTimeout(function(){ best.classList.remove("wrongpick"); }, 900);
      }
    }
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}
/* 答对：庆祝 + 整句 + 拆开跟读 */

    await sayLine(id, "Hello!", { tts: CHAR_GREETING[id] });
    princessWave();
    await sayLine("princess", "Hi, little " + ch.en + "! Let's play!", { tts: "Hi, little " + ch.en + "! Let's play!" });
    startWander(id);
  }
}
function onSpotTap(spot){
  var sp = $("spot-" + spot.id);
  if (!sp) return;
  sp.classList.add("glow");
  setTimeout(function(){ sp.classList.remove("glow"); }, 1200);
  sp.classList.remove("wiggle"); void sp.offsetWidth; sp.classList.add("wiggle");
  if (phase === "idle"){
    setDialogue("princess", "彩虹公主", "这是" + spot.zh + "！");
    setStatus("这是" + spot.zh);
  }
}

/* ================= 昼夜 ================= */
function cycleMode(){
  modeIdx = (modeIdx + 1) % MODES.length;
  applyMode();
}
function applyMode(){
  var m = MODES[modeIdx];
  islandEl.className = "mode-" + m;
  $("sunBtn").textContent = MODE_ICON[m];
  $("celestial").textContent = CELESTIAL[m];
  var tint = $("tintOverlay");
  if (tint){ tint.className = "tint-" + m; }
}

/* ================= 界面 ================= */
function showScreen(name){
  ["ov-unlock", "ov-setup", "ov-intro", "ov-finish"].forEach(function(id){ $(id).classList.add("hidden"); });
  if (name){ $(name).classList.remove("hidden"); }
}
function buildSetup(){
  var grid = $("wordGrid");
  grid.innerHTML = "";
  WORD_ORDER.forEach(function(wid){
    var w = WORDS[wid];
    var b = document.createElement("div");
    b.className = "wc" + (selWords.indexOf(wid) >= 0 ? " sel" : "");
    b.innerHTML = '<div class="wc-en" style="background:' + w.color + '">' + w.en + '</div><div class="wc-zh">' + w.zh + '</div>';
    b.addEventListener("click", function(){
      var i = selWords.indexOf(wid);
      if (i >= 0){ selWords.splice(i, 1); b.classList.remove("sel"); }
      else { selWords.push(wid); b.classList.add("sel"); }
      if (selWords.length === 0){ selWords.push(wid); b.classList.add("sel"); }
    });
    grid.appendChild(b);
  });
}

/* ================= 启动 ================= */
function init(){
  buildIsland();
  buildSetup();
  applyMode();
  requestAnimationFrame(tick);
  /* 岛面点按：公主走过去 */
  islandEl.addEventListener("click", onIslandTap);
  /* 点公主：挥手打招呼 */
  $("princess").addEventListener("click", function(e){
    e.stopPropagation();
    princessWave();
    if (phase === "idle" && !dialogueBusy){
      sayLine("princess", "Hi! I am Rainbow Princess!", { tts: "Hi! I am Rainbow Princess!" });
    }
  });
  $("sunBtn").addEventListener("click", function(){ cycleMode(); });
  $("replayBtn").addEventListener("click", function(){
    if (curRound && !dialogueBusy){
      var key = sentenceKey(curRound.word, curRound.spot);
      if (hasClip(key)){ playClip(key); }
      else { speak("The " + CHARS[curRound.animal].en + " is " + WORDS[curRound.word].en + " the " + SPOTS[curRound.spot].en + "."); }
    }
  });
  $("hintBtn").addEventListener("click", function(){
    if (curRound && phase === "answering"){
      var sp = $("spot-" + curRound.spot);
      if (sp){ sp.classList.add("glow"); setTimeout(function(){ sp.classList.remove("glow"); }, 1600); }
      princessPoint();
    }
  });
  /* 开声音 */
  $("unlockBtn").addEventListener("click", function(){
    audioUnlocked = true;
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.resume) ctx.resume();
    }catch(e){}
    playClip("silence");
    showScreen("ov-setup");
    setDialogue("princess", "彩虹公主", "你好呀！我是彩虹公主，欢迎来到彩虹小岛！");
  });
  $("setupStartBtn").addEventListener("click", function(){
    showScreen("ov-intro");
  });
  $("startBtn").addEventListener("click", function(){
    showScreen(null);
    startGame();
  });
  $("againBtn").addEventListener("click", function(){
    showScreen(null);
    seqToken++;
    CHAR_IDS.forEach(function(id){ clearPlacement(id); POS[id].x = HOME_POS[id].x; POS[id].y = HOME_POS[id].y; applyPos(id); });
    POS.princess.x = 50; POS.princess.y = 66; applyPos("princess"); snapCamera();
    startGame();
  });
  $("changeWordBtn").addEventListener("click", function(){
    seqToken++;
    buildSetup();
    showScreen("ov-setup");
  });
  /* 返回：按住 3 秒 */
  var backBtn = $("backBtn"), holdTimer = null, holdStart = 0;
  function startHold(e){
    e.preventDefault();
    holdStart = Date.now();
    var fill = backBtn.querySelector(".fill");
    holdTimer = setInterval(function(){
      var p = (Date.now() - holdStart) / 3000;
      if (fill) fill.style.height = Math.min(100, p * 100) + "%";
      if (p >= 1){
        clearInterval(holdTimer);
        if (fill) fill.style.height = "0%";
        seqToken++;
        stopAllWander();
        buildSetup();
        showScreen("ov-setup");
      }
    }, 50);
  }
  function cancelHold(){
    if (holdTimer) clearInterval(holdTimer);
    var fill = backBtn.querySelector(".fill");
    if (fill) fill.style.height = "0%";
  }
  backBtn.addEventListener("pointerdown", startHold);
  backBtn.addEventListener("pointerup", cancelHold);
  backBtn.addEventListener("pointerleave", cancelHold);

  window.__gameReady = true;
  window.__v14 = {
    POS: POS,
    phase: function(){ return phase; },
    curRound: function(){ return curRound; },
    stars: function(){ return stars; },
    walkPrincessTo: walkPrincessTo,
    walkTo: walkTo,
    startWander: startWander,
    stopWander: stopWander,
    startGame: startGame,
    cam: function(){ return { x: camX, y: camY }; },
    world: { w: WORLD_W, h: WORLD_H },
    view: function(){ return { w: islandEl.clientWidth, h: islandEl.clientHeight }; }
  };
  window.__v13 = window.__v14;
}
init();

</script>
</body>
