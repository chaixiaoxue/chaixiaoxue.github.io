<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>小马找位置小游戏</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #33302b;
        --ink-soft: #6f6a5e;
        --panel: #fffdf7;
        --panel-edge: #f0e4cd;
        --page: #fdf6e9;
        --accent: #e2603f;
        --accent-deep: #c94e2e;
        --gold: #f5a623;
        --good: #3d9d63;
        --sky-top: #aee3ff;
        --sky-bottom: #e8f9ff;
        --grass: #8ed081;
        --grass-deep: #6fbc5e;
        --shadow: 0 6px 0 rgba(51, 48, 43, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f3ecdd;
          --ink-soft: #c9c0ab;
          --panel: #2e2a24;
          --panel-edge: #4a4436;
          --page: #1d1a16;
          --accent: #f07a52;
          --accent-deep: #e2603f;
          --sky-top: #2c4a73;
          --sky-bottom: #5b7ba6;
          --grass: #4d7d43;
          --grass-deep: #3d6634;
          --shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "ZCOOL KuaiLe", "Baloo 2", system-ui, sans-serif;
        background: var(--page);
        color: var(--ink);
        min-height: 100dvh;
      }
      button { font-family: inherit; cursor: pointer; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
      .hidden { display: none !important; }

      /* ---------- Home ---------- */
      .hero { text-align: center; padding: 10px 0 4px; }
      .hero-horse { font-size: 84px; line-height: 1; display: inline-block; animation: bob 2.2s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
      @media (prefers-reduced-motion: reduce) {
        .hero-horse, .horse-el, .spot { animation: none !important; }
      }
      h1 { font-size: 34px; margin: 6px 0 2px; letter-spacing: 1px; }
      .hero p { margin: 0; color: var(--ink-soft); font-size: 17px; }
      .ask { text-align: center; font-size: 21px; margin: 22px 0 12px; }
      .word-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .word-card {
        border: 3px solid var(--panel-edge);
        background: var(--panel);
        border-radius: 20px;
        padding: 14px 12px 12px;
        text-align: left;
        box-shadow: var(--shadow);
        min-height: 104px;
        color: var(--ink);
        transition: transform 0.12s ease;
      }
      .word-card:active { transform: scale(0.96); }
      .word-card .en { font-family: "Baloo 2", "ZCOOL KuaiLe", sans-serif; font-weight: 800; font-size: 25px; line-height: 1.1; }
      .word-card .cn { font-size: 19px; margin-top: 2px; }
      .word-card .ex { font-size: 13.5px; color: var(--ink-soft); margin-top: 6px; font-family: "Baloo 2", sans-serif; font-weight: 600; }
      .word-card .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-bottom: 6px; }
      .mix-card {
        grid-column: 1 / -1;
        text-align: center;
        background: var(--accent);
        border-color: var(--accent-deep);
        color: #fff;
      }
      .mix-card .ex { color: rgba(255,255,255,0.85); }
      .parent-tip {
        margin-top: 20px; background: var(--panel); border: 2px dashed var(--panel-edge);
        border-radius: 16px; padding: 12px 14px; font-size: 15px; color: var(--ink-soft); line-height: 1.55;
      }
      .parent-tip strong { color: var(--ink); }

      /* ---------- Game top bar ---------- */
      .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .icon-btn {
        width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--panel-edge);
        background: var(--panel); font-size: 22px; box-shadow: var(--shadow); color: var(--ink);
        display: inline-flex; align-items: center; justify-content: center; flex: none;
      }
      .dots { display: flex; gap: 7px; flex: 1; justify-content: center; }
      .dots span { width: 15px; height: 15px; border-radius: 50%; background: var(--panel-edge); border: 2px solid var(--panel-edge); }
      .dots span.done { background: var(--gold); border-color: var(--gold); }
      .dots span.now { border-color: var(--accent); background: var(--panel); }
      .star-count {
        font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 20px;
        background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 999px;
        padding: 6px 14px; box-shadow: var(--shadow); min-width: 76px; text-align: center;
      }

      /* ---------- Instruction ---------- */
      .instruction {
        background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 20px;
        box-shadow: var(--shadow); padding: 12px 14px; display: flex; align-items: center; gap: 12px;
      }
      .instruction .txt { flex: 1; }
      .instruction .cn-line { font-size: 20px; line-height: 1.35; }
      .instruction .en-line { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 26px; color: var(--accent-deep); line-height: 1.15; }
      @media (prefers-color-scheme: dark) { .instruction .en-line { color: var(--accent); } }
      .speak-btn {
        width: 58px; height: 58px; border-radius: 50%; border: none; flex: none;
        background: var(--accent); color: #fff; font-size: 27px; box-shadow: 0 4px 0 var(--accent-deep);
      }
      .speak-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }

      /* ---------- Scene ---------- */
      .scene {
        position: relative; margin-top: 14px; height: 380px; border-radius: 24px; overflow: hidden;
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 58%, var(--grass) 58.2%, var(--grass-deep) 100%);
        border: 3px solid var(--panel-edge); box-shadow: var(--shadow);
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      @media (max-width: 420px) { .scene { height: 350px; } }
      .sun { position: absolute; top: 14px; right: 16px; font-size: 44px; }
      .cloud { position: absolute; font-size: 36px; opacity: 0.95; }
      .scene-obj {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%);
        font-size: clamp(118px, 34vw, 158px); line-height: 1; z-index: 3;
        filter: drop-shadow(0 8px 6px rgba(0,0,0,0.18)); pointer-events: none;
      }
      .obj-name {
        position: absolute; left: 50%; top: calc(50% + 74px); transform: translateX(-50%);
        z-index: 4; background: rgba(255,253,247,0.92); color: #33302b; border-radius: 999px;
        font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 16px; padding: 3px 14px; pointer-events: none;
        white-space: nowrap;
      }
      .spot {
        position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%;
        border: 4px dashed rgba(255,255,255,0.95); background: rgba(255,255,255,0.35);
        color: #fff; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 28px;
        z-index: 6; display: flex; align-items: center; justify-content: center;
        text-shadow: 0 1px 3px rgba(0,0,0,0.35);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.55); } 50% { box-shadow: 0 0 0 13px rgba(255,255,255,0); } }
      .spot.hint { background: var(--gold); border-color: #fff; color: #7a4b00; animation: pulse 0.7s ease-in-out infinite; }
      .spot.wrong { animation: wiggle 0.4s ease; background: rgba(255,120,90,0.55); }
      @keyframes wiggle { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
      .horse-el {
        position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; z-index: 5;
        font-size: 62px; line-height: 76px; text-align: center; cursor: grab;
        transition: left 0.55s cubic-bezier(.34,1.4,.5,1), top 0.55s cubic-bezier(.34,1.4,.5,1);
        filter: drop-shadow(0 5px 4px rgba(0,0,0,0.25)); touch-action: none;
      }
      .horse-el.dragging { transition: none; cursor: grabbing; z-index: 9; }
      .horse-el.jump { animation: jump 0.6s ease; }
      @keyframes jump { 0%,100% { margin-top: -38px; } 35% { margin-top: -74px; } 70% { margin-top: -30px; } }
      .home-tag {
        position: absolute; z-index: 2; font-size: 13px; color: rgba(255,255,255,0.95);
        transform: translate(-50%, 0); text-shadow: 0 1px 2px rgba(0,0,0,0.3); pointer-events: none;
        font-family: "Baloo 2", sans-serif; font-weight: 700;
      }
      .particle {
        position: absolute; z-index: 10; font-size: 24px; pointer-events: none;
        animation: burst 0.9s ease-out forwards;
      }
      @keyframes burst {
        0% { transform: translate(0,0) scale(0.4); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(1.25) rotate(40deg); opacity: 0; }
      }

      /* ---------- Feedback / next ---------- */
      .feedback { min-height: 56px; text-align: center; font-size: 22px; padding-top: 12px; line-height: 1.35; }
      .feedback .sentence { display: block; font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 19px; color: var(--good); margin-top: 2px; }
      .big-btn {
        display: block; width: 100%; min-height: 60px; border: none; border-radius: 999px;
        background: var(--accent); color: #fff; font-size: 23px; letter-spacing: 1px;
        box-shadow: 0 5px 0 var(--accent-deep); margin-top: 6px;
      }
      .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-deep); }
      .big-btn.ghost { background: var(--panel); color: var(--ink); border: 3px solid var(--panel-edge); box-shadow: var(--shadow); }
      .drag-tip { text-align: center; color: var(--ink-soft); font-size: 15px; margin-top: 8px; }

      /* ---------- Done ---------- */
      .done-box { text-align: center; padding-top: 26px; }
      .done-box .big-horse { font-size: 96px; display: inline-block; animation: bob 2s ease-in-out infinite; }
      .done-box h2 { font-size: 31px; margin: 8px 0 4px; }
      .done-box .stars-line { font-size: 34px; letter-spacing: 4px; margin: 6px 0; }
      .done-box p { color: var(--ink-soft); font-size: 18px; margin: 4px 0 18px; line-height: 1.5; }
      .done-box .big-btn { margin-top: 12px; }
      .learned {
        background: var(--panel); border: 3px solid var(--panel-edge); border-radius: 18px;
        box-shadow: var(--shadow); padding: 12px 16px; text-align: left; margin-bottom: 8px;
      }
      .learned div { font-family: "Baloo 2", sans-serif; font-weight: 600; font-size: 16.5px; padding: 4px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">

      <!-- ===== Home ===== -->
      <section id="screen-home">
        <div class="hero">
          <span class="hero-horse" aria-hidden="true">🐎</span>
          <h1>小马找位置</h1>
          <p>点一点、拖一拖，帮小马找到它的位置</p>
        </div>
        <p class="ask">今天练哪个词？选一个就好 🌈</p>
        <div class="word-grid" id="word-grid"></div>
        <div class="parent-tip">
          <strong>给爸爸妈妈的小提示：</strong>一次只练一个词，一轮 5 题，玩完就休息。
          孩子点错了游戏只会温柔提醒，不扣星星——慢慢来，她是在玩，不是在考试。
        </div>
      </section>

      <!-- ===== Game ===== -->
      <section id="screen-game" class="hidden">
        <div class="topbar">
          <button class="icon-btn" id="btn-back" aria-label="回到选词页">←</button>
          <div class="dots" id="dots" aria-hidden="true"></div>
          <div class="star-count" id="star-count">⭐ 0</div>
        </div>

        <div class="instruction">
          <div class="txt">
            <div class="en-line" id="ins-en">behind</div>
            <div class="cn-line" id="ins-cn">把小马放到山的后面</div>
          </div>
          <button class="speak-btn" id="btn-speak" aria-label="再听一遍">🔊</button>
        </div>

        <div class="scene" id="scene">
          <span class="sun" aria-hidden="true">🌞</span>
          <span class="cloud" style="left:8%; top:10px;" aria-hidden="true">☁️</span>
          <span class="cloud" style="left:38%; top:34px; font-size:26px;" aria-hidden="true">☁️</span>
          <div class="scene-obj" id="scene-obj">⛰️</div>
          <div class="obj-name" id="obj-name">mountain 山</div>
          <div class="home-tag" id="home-tag" style="left:14%; top:88%;">小马在这儿</div>
          <div class="horse-el" id="horse">🐎</div>
        </div>

        <div class="feedback" id="feedback"></div>
        <button class="big-btn hidden" id="btn-next">下一题 ➜</button>
        <p class="drag-tip" id="drag-tip">点一点发光的圆圈，或者把小马拖过去</p>
      </section>

      <!-- ===== Done ===== -->
      <section id="screen-done" class="hidden">
        <div class="done-box">
          <span class="big-horse" aria-hidden="true">🐎</span>
          <h2>太棒啦，全部完成！</h2>
          <div class="stars-line" id="done-stars">⭐⭐⭐⭐⭐</div>
          <p id="done-text">你帮小马找到了 5 个位置！<br />今天的词学会啦，去喝口水休息一下吧。</p>
          <div class="learned" id="learned"></div>
          <button class="big-btn" id="btn-again">再玩一次 🔁</button>
          <button class="big-btn ghost" id="btn-home">换个词玩 🏠</button>
        </div>
      </section>

    </div>

    <script>
      (function () {
        "use strict";

        /* ---------- Data ---------- */
        var WORDS = {
          behind: { en: "behind", cn: "后面", color: "#7fb069", distractors: ["front", "nextto"] },
          front:  { en: "in front of", cn: "前面", color: "#f5a623", distractors: ["behind", "nextto"] },
          nextto: { en: "next to", cn: "旁边", color: "#4dabf7", distractors: ["behind", "front"] },
          on:     { en: "on", cn: "上面", color: "#e2603f", distractors: ["under", "nextto"] },
          under:  { en: "under", cn: "下面", color: "#9775fa", distractors: ["on", "nextto"] },
          in_:    { en: "in", cn: "里面", color: "#f06595", distractors: ["on", "nextto"] }
        };
        var OBJECTS = {
          mountain: { en: "mountain", cn: "山", emoji: "⛰️" },
          house:    { en: "house", cn: "房子", emoji: "🏠" },
          tree:     { en: "tree", cn: "大树", emoji: "🌳" },
          box:      { en: "box", cn: "箱子", emoji: "📦" },
          basket:   { en: "basket", cn: "篮子", emoji: "🧺" },
          rock:     { en: "rock", cn: "石头", emoji: "🪨" },
          bridge:   { en: "bridge", cn: "小桥", emoji: "🌉" },
          umbrella: { en: "umbrella", cn: "雨伞", emoji: "🌂" },
          flower:   { en: "flower", cn: "花", emoji: "🌻" }
        };
        var SCENES = {
          behind: ["mountain", "house", "tree", "mountain", "house"],
          front:  ["house", "tree", "mountain", "tree", "house"],
          nextto: ["tree", "house", "flower", "mountain", "tree"],
          on:     ["box", "rock", "bridge", "box", "mountain"],
          under:  ["tree", "bridge", "umbrella", "tree", "bridge"],
          in_:    ["box", "basket", "house", "box", "basket"]
        };
        var POS = {
          behind: { x: 50, y: 27 },
          front:  { x: 50, y: 78 },
          nextto: { x: 82, y: 55 },
          on:     { x: 50, y: 13 },
          under:  { x: 50, y: 90 },
          in_:    { x: 50, y: 50 }
        };
        var HOME_POS = { x: 14, y: 76 };
        var PRAISE = ["太棒了！🎉", "你找到了！👏", "好厉害！🌟", "就是这里！💪", "小马好开心！🥳"];
        var TOTAL = 5;

        /* ---------- State ---------- */
        var mode = null;          // word key or "mix"
        var rounds = [];          // [{word, obj}]
        var idx = 0;
        var stars = 0;
        var locked = false;
        var wrongs = 0;
        var learnedSentences = [];
        var audioCtx = null;

        /* ---------- Elements ---------- */
        var $ = function (id) { return document.getElementById(id); };
        var elHome = $("screen-home"), elGame = $("screen-game"), elDone = $("screen-done");
        var elScene = $("scene"), elObj = $("scene-obj"), elObjName = $("obj-name");
        var elHorse = $("horse"), elFeedback = $("feedback"), elNext = $("btn-next");
        var elInsEn = $("ins-en"), elInsCn = $("ins-cn"), elDots = $("dots"), elStarCount = $("star-count");

        /* ---------- Sound ---------- */
        function speak(text, lang) {
          try {
            if (!("speechSynthesis" in window)) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = lang || "en-US";
            u.rate = 0.82;
            u.pitch = 1.15;
            window.speechSynthesis.speak(u);
          } catch (e) { /* no speech available — game still works silently */ }
        }
        function speakRound() {
          var r = rounds[idx];
          if (!r) return;
          speak(WORDS[r.word].en + "! The horse is " + WORDS[r.word].en + " the " + OBJECTS[r.obj].en + ".");
        }
        function jingle() {
          try {
            if (!audioCtx) {
              var AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              audioCtx = new AC();
            }
            if (audioCtx.state === "suspended") audioCtx.resume();
            var notes = [523.25, 659.25, 783.99];
            notes.forEach(function (freq, i) {
              var o = audioCtx.createOscillator(), g = audioCtx.createGain();
              o.type = "sine"; o.frequency.value = freq;
              o.connect(g); g.connect(audioCtx.destination);
              var t = audioCtx.currentTime + i * 0.11;
              g.gain.setValueAtTime(0.0001, t);
              g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
              g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
              o.start(t); o.stop(t + 0.32);
            });
          } catch (e) { /* silent fallback */ }
        }

        /* ---------- Helpers ---------- */
        function shuffle(a) {
          var arr = a.slice();
          for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
          }
          return arr;
        }
        function show(el) {
          [elHome, elGame, elDone].forEach(function (s) { s.classList.add("hidden"); });
          el.classList.remove("hidden");
          window.scrollTo(0, 0);
        }
        function setHorse(x, y) {
          elHorse.style.left = x + "%";
          elHorse.style.top = y + "%";
        }
        function sentence(word, obj) {
          return "The horse is " + WORDS[word].en + " the " + OBJECTS[obj].en + ".";
        }

        /* ---------- Home ---------- */
        function buildHome() {
          var grid = $("word-grid");
          grid.innerHTML = "";
          Object.keys(WORDS).forEach(function (key) {
            var w = WORDS[key];
            var objKey = SCENES[key][0];
            var b = document.createElement("button");
            b.className = "word-card";
            b.innerHTML =
              '<span class="dot" style="background:' + w.color + '"></span>' +
              '<div class="en">' + w.en + '</div>' +
              '<div class="cn">' + w.cn + '</div>' +
              '<div class="ex">' + sentence(key, objKey) + '</div>';
            b.addEventListener("click", function () { startGame(key); });
            grid.appendChild(b);
          });
          var mix = document.createElement("button");
          mix.className = "word-card mix-card";
          mix.innerHTML =
            '<div class="en">⭐ Mixed Fun 混合挑战</div>' +
            '<div class="ex">六个词轮流来，学过的宝宝来试试</div>';
          mix.addEventListener("click", function () { startGame("mix"); });
          grid.appendChild(mix);
        }

        /* ---------- Game flow ---------- */
        function startGame(m) {
          mode = m;
          stars = 0;
          idx = 0;
          learnedSentences = [];
          if (m === "mix") {
            var keys = shuffle(Object.keys(WORDS));
            rounds = [];
            for (var i = 0; i < TOTAL; i++) {
              var k = keys[i % keys.length];
              rounds.push({ word: k, obj: SCENES[k][Math.floor(Math.random() * SCENES[k].length)] });
            }
          } else {
            rounds = SCENES[m].map(function (o) { return { word: m, obj: o }; });
          }
          show(elGame);
          loadRound();
        }

        function loadRound() {
          locked = false;
          wrongs = 0;
          var r = rounds[idx];
          var w = WORDS[r.word], o = OBJECTS[r.obj];

          elInsEn.textContent = w.en;
          elInsCn.textContent = "把小马放到" + o.cn + "的" + w.cn;
          elObj.textContent = o.emoji;
          elObjName.textContent = o.en + " " + o.cn;
          elFeedback.innerHTML = "";
          elNext.classList.add("hidden");
          $("drag-tip").classList.remove("hidden");
          elStarCount.textContent = "⭐ " + stars;

          elDots.innerHTML = "";
          for (var i = 0; i < TOTAL; i++) {
            var d = document.createElement("span");
            if (i < idx) d.className = "done";
            else if (i === idx) d.className = "now";
            elDots.appendChild(d);
          }

          // clear old spots
          elScene.querySelectorAll(".spot").forEach(function (s) { s.remove(); });
          var spotWords = shuffle([r.word].concat(w.distractors));
          spotWords.forEach(function (sw) {
            var p = POS[sw];
            var b = document.createElement("button");
            b.className = "spot";
            b.style.left = p.x + "%";
            b.style.top = p.y + "%";
            b.textContent = "?";
            b.setAttribute("aria-label", "把小马放这里");
            b.dataset.word = sw;
            b.addEventListener("click", function () { evaluate(sw, b); });
            elScene.appendChild(b);
          });

          elHorse.classList.remove("jump");
          elHorse.style.zIndex = 5;
          elHorse.style.transform = "scale(1)";
          setHorse(HOME_POS.x, HOME_POS.y);
          $("home-tag").style.left = HOME_POS.x + "%";

          setTimeout(speakRound, 350);
        }

        function evaluate(wordKey, spotEl) {
          if (locked) return;
          var r = rounds[idx];
          if (wordKey === r.word) {
            locked = true;
            var p = POS[wordKey];
            setHorse(p.x, p.y);
            // behind: horse peeks from behind the object; in: horse sits inside, a bit smaller
            elHorse.style.zIndex = (wordKey === "behind") ? 2 : 7;
            elHorse.style.transform = (wordKey === "in_") ? "scale(0.78)" : "scale(1)";
            elHorse.classList.remove("jump");
            void elHorse.offsetWidth;
            elHorse.classList.add("jump");

            stars++;
            elStarCount.textContent = "⭐ " + stars;
            elScene.querySelectorAll(".spot").forEach(function (s) { s.remove(); });
            burst(p.x, p.y);
            jingle();

            var s = sentence(r.word, r.obj);
            learnedSentences.push(s);
            elFeedback.innerHTML =
              PRAISE[Math.floor(Math.random() * PRAISE.length)] +
              '<span class="sentence">' + s + "</span>";
            speak("Great job! " + s);
            $("drag-tip").classList.add("hidden");
            elNext.textContent = (idx === TOTAL - 1) ? "完成啦 🎉" : "下一题 ➜";
            elNext.classList.remove("hidden");
          } else {
            wrongs++;
            if (spotEl) {
              spotEl.classList.remove("wrong");
              void spotEl.offsetWidth;
              spotEl.classList.add("wrong");
            }
            elFeedback.textContent = wrongs >= 2 ? "看一看，亮亮的圆圈就是小马的家 ✨" : "再试一次，你可以的！💛";
            if (wrongs >= 2) {
              elScene.querySelectorAll(".spot").forEach(function (sp) {
                if (sp.dataset.word === r.word) sp.classList.add("hint");
              });
            }
          }
        }

        function burst(x, y) {
          var icons = ["⭐", "🌟", "✨", "💛", "🎉"];
          for (var i = 0; i < 10; i++) {
            var s = document.createElement("span");
            s.className = "particle";
            s.textContent = icons[i % icons.length];
            s.style.left = x + "%";
            s.style.top = y + "%";
            var ang = (Math.PI * 2 * i) / 10 + Math.random() * 0.5;
            var dist = 60 + Math.random() * 60;
            s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
            s.style.setProperty("--dy", Math.sin(ang) * dist - 30 + "px");
            elScene.appendChild(s);
            (function (node) { setTimeout(function () { node.remove(); }, 950); })(s);
          }
        }

        function finish() {
          show(elDone);
          $("done-stars").textContent = "⭐".repeat(Math.max(stars, 1)) + (stars < TOTAL ? "☆".repeat(TOTAL - stars) : "");
          var wordName = mode === "mix" ? "六个方位词" : WORDS[mode].en + "（" + WORDS[mode].cn + "）";
          $("done-text").innerHTML = "你帮小马找到了 " + stars + " 个位置！<br />今天练的词是 <strong>" + wordName + "</strong>，去喝口水休息一下吧。";
          $("learned").innerHTML = learnedSentences.map(function (s) { return "<div>🐎 " + s + "</div>"; }).join("");
          speak("Great job! You did it!");
          jingle();
        }

        /* ---------- Drag the horse ---------- */
        var dragging = false;
        function scenePct(e) {
          var rect = elScene.getBoundingClientRect();
          var x = ((e.clientX - rect.left) / rect.width) * 100;
          var y = ((e.clientY - rect.top) / rect.height) * 100;
          return { x: Math.max(4, Math.min(96, x)), y: Math.max(6, Math.min(94, y)) };
        }
        elHorse.addEventListener("pointerdown", function (e) {
          if (locked) return;
          dragging = true;
          elHorse.classList.add("dragging");
          try { elHorse.setPointerCapture(e.pointerId); } catch (err) {}
          var p = scenePct(e);
          setHorse(p.x, p.y);
          e.preventDefault();
        });
        elHorse.addEventListener("pointermove", function (e) {
          if (!dragging) return;
          var p = scenePct(e);
          setHorse(p.x, p.y);
        });
        function endDrag(e) {
          if (!dragging) return;
          dragging = false;
          elHorse.classList.remove("dragging");
          var p = scenePct(e);
          var r = rounds[idx];
          if (!r) return;
          var all = [r.word].concat(WORDS[r.word].distractors);
          var best = null, bestDist = 1e9;
          all.forEach(function (k) {
            var sp = POS[k];
            var d = Math.hypot(sp.x - p.x, sp.y - p.y);
            if (d < bestDist) { bestDist = d; best = k; }
          });
          if (best && bestDist < 20) {
            var spotEl = elScene.querySelector('.spot[data-word="' + best + '"]');
            evaluate(best, spotEl);
            if (!locked) setHorse(HOME_POS.x, HOME_POS.y);
          } else {
            setHorse(HOME_POS.x, HOME_POS.y);
          }
        }
        elHorse.addEventListener("pointerup", endDrag);
        elHorse.addEventListener("pointercancel", endDrag);

        /* ---------- Buttons ---------- */
        $("btn-back").addEventListener("click", function () {
          try { window.speechSynthesis.cancel(); } catch (e) {}
          show(elHome);
        });
        $("btn-speak").addEventListener("click", speakRound);
        elNext.addEventListener("click", function () {
          idx++;
          if (idx >= TOTAL) finish();
          else loadRound();
        });
        $("btn-again").addEventListener("click", function () { startGame(mode); });
        $("btn-home").addEventListener("click", function () { show(elHome); });

        buildHome();
      })();
    </script>
  </body>
</html>
